spring.application.name=tradersguardian

# Supabase PostgreSQL Configuration
# Set SUPABASE_PASSWORD environment variable or add to .env file
spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST:aws-1-ap-south-1.pooler.supabase.com}:${SUPABASE_PORT:5432}/postgres?sslmode=require
spring.datasource.username=${SUPABASE_USER:postgres.ixmvlhdqrcokeqhrdifr}
spring.datasource.password=${SUPABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=your-super-secret-jwt-key-change-this-in-production-to-something-long-and-secure
app.jwt.expiration=86400000
